# -----------------------------------------------------------------------------
# .github/workflows/ci.yml — PLACEHOLDER
#
# This workflow is committed alongside the Phase 0 codebase so that if/when a
# GitHub remote is added the pipeline starts running with zero further setup.
# As of this commit the repo may not yet be pushed to GitHub — that is OK,
# nothing here is executed locally.
#
# What this workflow does once enabled:
#   - lint:       static checks (ktlint TODO — wired up but disabled until the
#                 plugin is added to app/build.gradle.kts)
#   - unit-test:  ./gradlew testDebugUnitTest   (pure JVM, no emulator)
#   - build:      ./gradlew assembleDebug       (sanity check the APK builds)
#
# The Android instrumented tests (./gradlew connectedDebugAndroidTest) are NOT
# wired here on purpose — they need an emulator which is non-trivial on stock
# GitHub runners. Add a separate macOS-based job with `reactivecircus/android-
# emulator-runner` when ready.
#
# NOTE: The Gradle wrapper JAR (gradle/wrapper/gradle-wrapper.jar) is currently
# missing from this repo; the action below will regenerate it via
# `gradle/actions/wrapper-validation-action` + `setup-gradle`.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      # TODO: enable once ktlint plugin is added to app/build.gradle.kts
      # - name: ktlint
      #   run: ./gradlew --no-daemon ktlintCheck
      - name: Placeholder
        run: echo "ktlint not yet enabled — see app/build.gradle.kts TODO"

  unit-test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
